# cloudflared ingress config for ai-service.
# Run: cloudflared tunnel --config ai-service.config.yml run
#
# Replace <TUNNEL_ID> and <your-domain> below. See ../README.md for the one-time
# `cloudflared tunnel create` / `tunnel route dns` setup that produces these values.
#
# ai-service has no REST framework (see grpc_server.py) — just its gRPC server and the
# stdlib-only /internal/mesh/status diagnostic HTTP endpoint (mesh_status.py).

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/ai-service.json

ingress:
  # gRPC mesh port (GRPC_PORT=6005). h2c:// tells cloudflared to speak cleartext HTTP/2 to the
  # origin — ai-service's grpc.aio.server() keeps listening in plaintext unchanged; Cloudflare
  # terminates TLS at the edge for the public hostname instead. Peers dial this hostname over
  # TLS by setting GRPC_USE_TLS=true (see .env.example).
  - hostname: ai-internal.<your-domain>
    service: h2c://localhost:6005

  # Mesh-status diagnostic port (MESH_HTTP_PORT, default 7005).
  - hostname: ai-mesh.<your-domain>
    service: http://localhost:7005

  - service: http_status:404
