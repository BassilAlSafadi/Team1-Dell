; Keeps all 7 backend processes (gateway + 6 services) alive in the single container a
; Hugging Face Docker Space runs. Port/peer-address values here are the same bare-metal
; assignments ../run-services.sh uses (gateway=9080, auth=9081, transaction=9082,
; marketplace=9083, messaging=9084, notification=9085) — only the mechanism (supervisord vs.
; a bash trap) differs. Real secrets (DB connection strings, JWT signing key, Redis URL,
; Internal__ServiceToken, Google/SMTP/Gemini/Mongo credentials) come from the container's own
; environment (Space Secrets/Variables), which every child process here inherits in addition
; to the topology overrides below.

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:auth-service]
directory=/app/auth-service
command=dotnet AuthService.Api.dll
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=ASPNETCORE_URLS="http://localhost:9081",Grpc__Port="6001",Grpc__Peers__Transaction="http://localhost:6002",Grpc__Peers__Messaging="http://localhost:6003",Grpc__Peers__Notification="http://localhost:6004",Grpc__Peers__Ai="http://localhost:6005"

[program:transaction-service]
directory=/app/transaction-service
command=dotnet TransactionService.Api.dll
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=ASPNETCORE_URLS="http://localhost:9082",Grpc__Port="6002",Grpc__Peers__Auth="http://localhost:6001",Grpc__Peers__Messaging="http://localhost:6003",Grpc__Peers__Notification="http://localhost:6004",Grpc__Peers__Ai="http://localhost:6005",Internal__MarketplaceRestAddr="http://localhost:9083"

[program:marketplace-service]
directory=/app/marketplace-service
command=dotnet MarketplaceService.Api.dll
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=ASPNETCORE_URLS="http://localhost:9083"

[program:messaging-service]
directory=/app/messaging-service
command=node src/server.js
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PORT="9084",NODE_ENV="production",GRPC_PORT="6003",AUTH_GRPC_ADDR="localhost:6001",TRANSACTION_GRPC_ADDR="localhost:6002",NOTIFICATION_GRPC_ADDR="localhost:6004",AI_GRPC_ADDR="localhost:6005"

[program:notification-service]
directory=/app/notification-service
command=/app/notification-service/notification-service
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PORT="9085",ENV="production",GRPC_PORT="6004",AUTH_GRPC_ADDR="localhost:6001",TRANSACTION_GRPC_ADDR="localhost:6002",MESSAGING_GRPC_ADDR="localhost:6003",AI_GRPC_ADDR="localhost:6005"

[program:ai-service]
directory=/app/ai-service
command=/app/ai-service/.venv/bin/python grpc_server.py
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=GRPC_PORT="6005",MESH_HTTP_PORT="7005",AUTH_GRPC_ADDR="localhost:6001",TRANSACTION_GRPC_ADDR="localhost:6002",MESSAGING_GRPC_ADDR="localhost:6003",NOTIFICATION_GRPC_ADDR="localhost:6004"

; Started last (highest priority number) and after the others via the fixed startsecs delay
; below, since it dials all 5 peers above at request time, not at startup — startup order
; only matters for first-request latency, not correctness.
[program:gateway]
directory=/app/gateway
command=/app/gateway/gateway
priority=100
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PORT="9080",AUTH_GRPC_ADDR="localhost:6001",TRANSACTION_GRPC_ADDR="localhost:6002",MESSAGING_GRPC_ADDR="localhost:6003",NOTIFICATION_GRPC_ADDR="localhost:6004",AI_GRPC_ADDR="localhost:6005",AUTH_REST_ADDR="localhost:9081",TRANSACTION_REST_ADDR="localhost:9082",MESSAGING_REST_ADDR="localhost:9084",NOTIFICATION_REST_ADDR="localhost:9085",MARKETPLACE_REST_ADDR="localhost:9083"
