# Wires all 6 services onto one Docker network so their gRPC (and REST-fallback) addresses
# resolve by service name. The gateway is the sole published entry point (decision (e) in
# gateway/IMPLEMENTATION_PLAN.md): backend REST *and* gRPC ports stay reachable inside this
# network but are never published to the host. This matters because all end-user authentication
# lives in the gateway — a published backend port would route around it completely, and the
# gRPC servers only accept internal-mesh credentials (see Internal__ServiceToken), not user JWTs.
# To debug a backend port locally, use `docker compose exec` or add a temporary override file
# rather than re-adding `ports:` here.
#
# Databases (Postgres via Supabase, MongoDB via Atlas) and the shared Redis instance stay
# external per each service's own .env — no local DB/Redis containers here.
#
# auth-service, transaction-service and messaging-service all need the repo-root /proto
# directory available inside their build (C# Grpc.Tools codegen) or runtime (Node
# @grpc/proto-loader) — hence `context: .` + an explicit `dockerfile:` path for those three.
# notification-service (Go), ai-service (Python) and the gateway (Go) check in their generated
# stubs, so their builds are scoped to their own service directory as before.

services:
  gateway:
    build: ./gateway
    env_file: ./gateway/.env
    environment:
      PORT: "8080"
      AUTH_GRPC_ADDR: "auth-service:6001"
      TRANSACTION_GRPC_ADDR: "transaction-service:6002"
      MESSAGING_GRPC_ADDR: "messaging-service:6003"
      NOTIFICATION_GRPC_ADDR: "notification-service:6004"
      AI_GRPC_ADDR: "ai-service:6005"
      AUTH_REST_ADDR: "auth-service:8080"
      TRANSACTION_REST_ADDR: "transaction-service:8080"
      MESSAGING_REST_ADDR: "messaging-service:8080"
      NOTIFICATION_REST_ADDR: "notification-service:8080"
      MARKETPLACE_REST_ADDR: "marketplace-service:8080"
      # Shared blob store for chat/message attachments — bind-mounted below so uploads
      # outlive container rebuilds.
      UPLOAD_DIR: "/data/uploads"
    ports:
      - "8080:8080"
    volumes:
      # Named volume (not a bind mount): it inherits the image's app:app ownership of
      # /data/uploads on first use, so the non-root gateway process can write to it, and it
      # persists across `up -d --build` / `down` (removed only by `down -v`).
      - gateway-uploads:/data/uploads
    depends_on: [auth-service, transaction-service, messaging-service, notification-service, ai-service, marketplace-service]
    networks: [mesh]

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: ./services/auth-service/.env
    environment:
      Grpc__Port: "6001"
      Grpc__Peers__Transaction: "http://transaction-service:6002"
      Grpc__Peers__Messaging: "http://messaging-service:6003"
      Grpc__Peers__Notification: "http://notification-service:6004"
      Grpc__Peers__Ai: "http://ai-service:6005"
    expose: ["8080", "6001"]
    networks: [mesh]

  transaction-service:
    build:
      context: .
      dockerfile: services/transaction-service/Dockerfile
    env_file: ./services/transaction-service/.env
    environment:
      Grpc__Port: "6002"
      Grpc__Peers__Auth: "http://auth-service:6001"
      Grpc__Peers__Messaging: "http://messaging-service:6003"
      Grpc__Peers__Notification: "http://notification-service:6004"
      Grpc__Peers__Ai: "http://ai-service:6005"
      Internal__MarketplaceRestAddr: "http://marketplace-service:8080"
    expose: ["8080", "6002"]
    depends_on: [marketplace-service]
    networks: [mesh]

  messaging-service:
    build:
      context: .
      dockerfile: services/messaging-service/Dockerfile
    env_file: ./services/messaging-service/.env
    environment:
      GRPC_PORT: "6003"
      AUTH_GRPC_ADDR: "auth-service:6001"
      TRANSACTION_GRPC_ADDR: "transaction-service:6002"
      NOTIFICATION_GRPC_ADDR: "notification-service:6004"
      AI_GRPC_ADDR: "ai-service:6005"
    expose: ["8080", "6003"]
    networks: [mesh]

  notification-service:
    build: ./services/notification-service
    env_file: ./services/notification-service/.env
    environment:
      GRPC_PORT: "6004"
      AUTH_GRPC_ADDR: "auth-service:6001"
      TRANSACTION_GRPC_ADDR: "transaction-service:6002"
      MESSAGING_GRPC_ADDR: "messaging-service:6003"
      AI_GRPC_ADDR: "ai-service:6005"
    expose: ["8080", "6004"]
    networks: [mesh]

  ai-service:
    build: ./services/ai-service
    env_file: ./services/ai-service/.env
    environment:
      GRPC_PORT: "6005"
      MESH_HTTP_PORT: "7005"
      AUTH_GRPC_ADDR: "auth-service:6001"
      TRANSACTION_GRPC_ADDR: "transaction-service:6002"
      MESSAGING_GRPC_ADDR: "messaging-service:6003"
      NOTIFICATION_GRPC_ADDR: "notification-service:6004"
    expose: ["6005", "7005"]
    networks: [mesh]

  marketplace-service:
    build: ./services/marketplace-service
    env_file: ./services/marketplace-service/.env
    expose: ["8080"]
    networks: [mesh]

networks:
  mesh:
    driver: bridge

volumes:
  gateway-uploads:
