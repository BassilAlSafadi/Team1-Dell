# Regenerate with (from gateway/):
#   PATH="$PATH:$(go env GOPATH)/bin" buf generate ../proto
version: v1
plugins:
  - plugin: go
    out: internal/grpcgen
    opt: paths=source_relative
  - plugin: go-grpc
    out: internal/grpcgen
    opt: paths=source_relative,require_unimplemented_servers=false
